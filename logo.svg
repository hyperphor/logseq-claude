<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background: solid dark square, opaque so icon reads on light/dark plugin lists -->
  <rect width="128" height="128" rx="24" fill="#1C1B19"/>

  <!-- Stem: bubble grows out of the bullet below it -->
  <rect x="21" y="86" width="10" height="16" rx="3" fill="#CC785C"/>

  <!-- Block bullet (Logseq outline bullet), the mark's origin point -->
  <circle cx="26" cy="107" r="11" fill="#CC785C"/>

  <!-- Speech bubble body: the block's bullet, turned into a question -->
  <rect x="16" y="14" width="96" height="76" rx="22" fill="#CC785C"/>

  <!-- Question mark, hand-authored as path + dot (no text glyph) -->
  <path d="M 54,36 C 54,25 63,20 72,24 C 81,28 81,39 72,44 C 65,48 64,51 64,58"
        fill="none" stroke="#1C1B19" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="75" r="6.5" fill="#1C1B19"/>
</svg>
